[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barchart-data"
version = "0.11.0"
description = "Credential-free Barchart public data and interactive chart history client"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "tagomatech"}]
dependencies = [
    "pandas>=1.5",
    "requests>=2.28",
    "urllib3>=1.26",
]

[project.urls]
Homepage = "https://github.com/tagomatech/barchart-data"
Repository = "https://github.com/tagomatech/barchart-data"

[project.optional-dependencies]
demo = [
    "matplotlib>=3.7",
    "jupyterlab>=4.0",
    "screamer>=1.2,<2",
]
browser = [
    "playwright>=1.45",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["barchart_data*", "Barchart*"]
exclude = ["Barchart.tests*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"Barchart/**" = ["N999"]
