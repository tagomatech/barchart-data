name: Barchart tests

on:
  push:
    paths:
      - "Barchart/**"
      - "barchart_data/**"
      - "notebooks/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/barchart.yml"
  pull_request:
    paths:
      - "Barchart/**"
      - "barchart_data/**"
      - "notebooks/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/barchart.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q Barchart barchart_data notebooks
      - name: Validate notebooks
        run: python -c "import json; from pathlib import Path; [json.loads(path.read_text(encoding='utf-8')) for path in Path('notebooks').rglob('*.ipynb')]"
      - name: Run Ruff
        run: ruff check barchart_data Barchart tests
      - name: Run package tests
        run: python -m unittest discover -s tests -v
